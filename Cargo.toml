[workspace]
members = ["crates/vm", "crates/compiler", "crates/harness", "crates/binding-macros", "crates/host-dts"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
oxc = { version = "=0.159.0", features = ["ast_visit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regress = { version = "=0.12.0", features = ["utf16"] }
ryu-js = "=1.0.3"
thiserror = "2.0"
