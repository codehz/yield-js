[workspace]
members = ["crates/vm", "crates/compiler", "crates/poc"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
oxc = { version = "=0.159.0", features = ["ast_visit"] }
regex = "=1.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
