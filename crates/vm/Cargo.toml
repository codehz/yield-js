[package]
name = "yield-vm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
url = { version = "2.5", features = ["serde"] }
urlpattern = "0.6.0"
bincode.workspace = true
brotli = { version = "=9.0.0", features = ["portable-float"] }
brotli-decompressor = "=6.0.1"
chrono = { version = "0.4", default-features = false }
chrono-tz = "=0.10.4"
icu_normalizer = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Match chrono-tz 0.10.4's IANA 2025b data.
jiff-tzdb = "=0.1.4"
miniz_oxide = { path = "src/builtin/streams/compression/vendor/miniz_oxide", features = ["serde"] }
num-bigint.workspace = true
num-traits.workspace = true
regress.workspace = true
ryu-js.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
xxhash-rust.workspace = true
thiserror.workspace = true
yield-binding-macros = { path = "../binding-macros" }
